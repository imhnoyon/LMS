<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f7fb; font-family:Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f7fb; padding:40px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.08);">
                    
                    <tr>
                        <td style="background:#0f172a; padding:24px 32px; text-align:center;">
                            <h1 style="margin:0; color:#ffffff; font-size:24px;">{{ app_name }}</h1>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:32px;">
                            <h2 style="margin:0 0 16px; color:#111827; font-size:22px;">
                                {{ subject }}
                            </h2>

                            <p style="margin:0 0 12px; color:#374151; font-size:15px; line-height:1.7;">
                                Hello {{ recipient_name|default:"User" }},
                            </p>

                            <div style="margin:20px 0; color:#4b5563; font-size:15px; line-height:1.8;">
                                {{ message|linebreaks }}
                            </div>

                            {% if button_url %}
                            <div style="margin:30px 0; text-align:center;">
                                <a href="{{ button_url }}"
                                   style="display:inline-block; background:#0f172a; color:#ffffff; text-decoration:none; padding:14px 28px; border-radius:8px; font-size:15px; font-weight:bold;">
                                    {{ button_text|default:"Open Link" }}
                                </a>
                            </div>
                            {% endif %}

                            <p style="margin:24px 0 0; color:#6b7280; font-size:14px; line-height:1.6;">
                                Thanks,<br>
                                <strong>{{ app_name }}</strong>
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="background:#f9fafb; padding:20px 32px; text-align:center; border-top:1px solid #e5e7eb;">
                            <p style="margin:0; font-size:12px; color:#9ca3af;">
                                This email was sent from {{ app_name }}.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
